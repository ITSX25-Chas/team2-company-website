name: Deploy to K3s

on:
  # The former Headscale/KUBECONFIG route targets the pre-Comerit cluster.
  # Keep deployments manual until the new, limited CI/CD route is approved.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Normalize image reference
        id: image
        shell: bash
        run: echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.reference }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v2.6.4

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}"

      - name: Sign image with Cosign
        run: cosign sign --yes "${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}"

      # --- Network connectivity to K3s node ---
      - name: Generate Ephemeral Headscale Key
        id: generate_key
        run: |
          EXPIRATION=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)

          RESPONSE=$(curl -s -f -X POST "${{ secrets.HEADSCALE_URL }}/api/v1/preauthkey" \
            -H "Authorization: Bearer ${{ secrets.HEADSCALE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "user": ${{ vars.HEADSCALE_USER_ID }},
                  "ephemeral": true,
                  "reusable": false,
                  "expiration": "'"$EXPIRATION"'",
                  "aclTags": ["tag:github-runner"]
                }')

          EPHEMERAL_KEY=$(echo "$RESPONSE" | jq -r '.preAuthKey.key')

          if [ -z "$EPHEMERAL_KEY" ] || [ "$EPHEMERAL_KEY" == "null" ]; then
            echo "Error: Failed to retrieve key from Headscale API"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$EPHEMERAL_KEY"
          echo "key=$EPHEMERAL_KEY" >> $GITHUB_OUTPUT

      - name: Connect to Headscale Mesh
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ steps.generate_key.outputs.key }}
          args: --login-server=${{ secrets.HEADSCALE_URL }}
          version: 1.102.4

      - name: Verify connectivity to K3s node
        run: |
          K3S_HOST="10.0.${{ vars.TEAM_ID }}.3"

          for attempt in {1..12}; do
            if ip route get "$K3S_HOST" | grep -q tailscale0 && \
               timeout 3 bash -c "</dev/tcp/$K3S_HOST/6443"; then
              echo "Tailscale route and K3s API connectivity confirmed"
              exit 0
            fi

            echo "Waiting for the Headscale subnet route (attempt $attempt/12)"
            sleep 5
          done

          echo "Error: K3s API did not become reachable through Tailscale"
          ip route get "$K3S_HOST" || true
          tailscale status || true
          exit 1

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get pods -n default

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}"
          export GIT_COMMIT="${{ github.sha }}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f k8s/image-policy.yaml
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl rollout status deployment/company-website --timeout=120s

      - name: Collect deployment diagnostics
        if: failure()
        run: |
          if [ ! -f "$HOME/.kube/config" ]; then
            echo "Kubeconfig is unavailable; skipping cluster diagnostics"
            exit 0
          fi

          kubectl get pods -l app=company-website -o wide || true
          kubectl describe pods -l app=company-website || true
          kubectl get pvc company-website-data || true
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -n 50 || true
          kubectl logs -l app=company-website --all-containers=true --prefix --tail=100 || true
          kubectl logs -l app=company-website -c web --previous --tail=100 || true
          kubectl logs -l app=company-website -c fix-data-permissions --previous --tail=100 || true
