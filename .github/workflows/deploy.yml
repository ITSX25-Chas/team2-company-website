name: Deploy to K3s

on:
  # Deployment remains manual during the Comerits migration.
  # Each completed run is reviewed before automatic deployment is reconsidered.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Normalize image reference
        id: image
        shell: bash
        run: echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.reference }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v2.6.4

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}"

      - name: Sign image with Cosign
        run: cosign sign --yes "${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}"

      # The deploy identity can open only an IAP tunnel to the Kubernetes API.
      # CICD_SERVICE_ACCOUNT remains the separate read-only account.
      - name: Authenticate deploy tunnel to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Open and verify IAP tunnel to K3s API
        run: |
          gcloud compute start-iap-tunnel team2-primary 6443 \
            --project=itsx25-comerit \
            --zone=europe-north2-b \
            --local-host-port=127.0.0.1:6443 \
            --verbosity=warning \
            > /tmp/iap-k3s-tunnel.log 2>&1 &
          echo $! > /tmp/iap-k3s-tunnel.pid

          for attempt in {1..12}; do
            if timeout 3 bash -c "</dev/tcp/127.0.0.1/6443"; then
              echo "IAP tunnel to the K3s API is reachable"
              exit 0
            fi

            echo "Waiting for the IAP tunnel (attempt $attempt/12)"
            sleep 5
          done

          echo "Error: K3s API did not become reachable through IAP"
          cat /tmp/iap-k3s-tunnel.log || true
          exit 1

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          CLUSTER_NAME="$(kubectl config view -o jsonpath='{.clusters[0].name}')"
          kubectl config set-cluster "$CLUSTER_NAME" --server=https://127.0.0.1:6443
          kubectl get pods -n default

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}"
          export GIT_COMMIT="${{ github.sha }}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl api-resources --api-group=policy.sigstore.dev -o name | \
            grep -qx 'clusterimagepolicies.policy.sigstore.dev'
          kubectl apply -f k8s/image-policy.yaml
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl rollout status deployment/company-website --timeout=120s

      - name: Collect deployment diagnostics
        if: failure()
        run: |
          if [ ! -f "$HOME/.kube/config" ]; then
            echo "Kubeconfig is unavailable; skipping cluster diagnostics"
            exit 0
          fi

          kubectl get pods -l app=company-website -o wide || true
          kubectl describe pods -l app=company-website || true
          kubectl get pvc company-website-data || true
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -n 50 || true
          kubectl logs -l app=company-website --all-containers=true --prefix --tail=100 || true
          kubectl logs -l app=company-website -c web --previous --tail=100 || true
          kubectl logs -l app=company-website -c fix-data-permissions --previous --tail=100 || true
          cat /tmp/iap-k3s-tunnel.log || true
