apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: default # Inserted namespace
---
# Kubernetes v1.24+ does not create legacy ServiceAccount token Secrets
# automatically. This explicit Secret is scoped to github-deployer and its
# base64-encoded kubeconfig is stored only as the GitHub KUBECONFIG secret.
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer-role
  namespace: default # Inserted namespace
rules:
  - apiGroups: [""]
    resources: [
        #  "configmaps",
        "persistentvolumeclaims",
        #  "secrets",
        "services",
        "pods",
        "events",
      ]
    #verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    #verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer-binding
  namespace: default # Inserted namespace
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: default # Inserted namespace
roleRef:
  kind: Role
  name: github-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterImagePolicy is a cluster-scoped resource, so it cannot be granted
# through the namespace-scoped Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-deployer-image-policy
rules:
  - apiGroups: ["policy.sigstore.dev"]
    resources: ["clusterimagepolicies"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-deployer-image-policy
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-deployer-image-policy
